name: Record TestScreen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/record-testscreen.yml'
      - 'scripts/record-testscreen.sh'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record TestScreen on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-spellchecker: true
          script: bash ./scripts/record-testscreen.sh

      - name: Upload screen recording
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testscreen-recording
          path: testscreen-recording.mp4
          if-no-files-found: warn
