name: Record TestScreen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/record-testscreen.yml'
      - 'scripts/record-testscreen.sh'
      - 'android/app/src/main/java/com/saferegiontesttask/MainActivity.kt'
      - 'pages/test-screen/**'
      - 'components/TobBar/**'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: true
          dotnet: true
          haskell: true
          swap-storage: true
          docker-images: false
          large-packages: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Android bundle and APK
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/
          cd android
          ./gradlew app:assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon
          cd ..

      - name: Record TestScreen on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-spellchecker: true
          disable-animations: true
          disk-size: 6000M
          heap-size: 600M
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -no-snapshot-save -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ./scripts/record-testscreen.sh

      - name: Upload screen recording
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testscreen-recording
          path: testscreen-recording.mp4
          if-no-files-found: warn

      - name: Commit recording to repository
        if: success()
        run: |
          mkdir -p docs/recordings
          cp testscreen-recording.mp4 docs/recordings/testscreen-recording.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/recordings/testscreen-recording.mp4
          git diff --staged --quiet || git commit -m "add TestScreen screen recording"
          git push
